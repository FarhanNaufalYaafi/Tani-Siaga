components:
  securitySchemes:
    AccessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HTTP-only access-token cookie set by signin, email verification, or Google OAuth.
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HTTP-only refresh-token cookie set by signin, email verification, or Google OAuth.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
    FarmlandId:
      name: farmlandId
      in: path
      required: true
      schema:
        type: integer
    Page8:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    Limit8:
      name: limit
      in: query
      schema:
        type: integer
        default: 8
        minimum: 1
    Search:
      name: search
      in: query
      schema:
        type: string
        default: ''
    Page1:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    Page10:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    Limit10:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
  requestBodies:
    ReasonOptional:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
  responses:
    BadRequest:
      description: Invalid input or business-rule failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Unauthorized:
      description: Missing, invalid, or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Forbidden:
      description: Authenticated user lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Conflict:
      description: Request conflicts with the current resource or session state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    ServerError:
      description: Internal or external service failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
  schemas:
    HttpError:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
    ServiceResult:
      description: Service-defined response; exact structure depends on the operation.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items:
            type: object
            additionalProperties: true
        - type: string
    Message:
      type: object
      properties:
        message:
          type: string
    SuccessData:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ServiceResult'
    SessionUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        email:
          type: string
          format: email
        role:
          type: string
    User:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
    SignUpLocal:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Must satisfy the application's strong-password validation.
    EmailCode:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
    ForgotPassword:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPassword:
      type: object
      required: [email, code, password, confirmPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
        password:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password
    ChangeProfilePassword:
