openapi: 3.0.3
info:
  title: Tani Siaga API
  version: 1.0.0
  description: |
    dokumentasi kontrak API Tani Siaga platform bagi para petani demi menurunkan persentase gagal panen melalui aksi rekomendasi dan analisis cuaca API BMKG
  contact:
    name: Tani Siaga
servers:
  - url: http://localhost:3000
    description: Local backend
tags:
  - name: Authentication
  - name: Users
  - name: Farmer groups
  - name: Farmlands
  - name: Commodities
  - name: Wilayah
  - name: Media
  - name: Notifications
  - name: AI recommendations
  - name: Shops
  - name: Products
  - name: Cart
  - name: Cart items
  - name: Orders
security:
  - AccessTokenCookie: []
paths:
  /auth/signup:
    post:
      tags: [Authentication]
      summary: Register a local account
      description: Requires no active session. Sends/starts email verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpLocal'
      responses:
        '200':
          description: Signup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify signup email and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCode'
      responses:
        '200':
          description: Account information; access and refresh cookies are set
          headers:
            Set-Cookie:
              description: Sets `access_token` and `refresh_token` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
      responses:
        '200':
          description: Request result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/verify-reset-code:
    post:
      tags: [Authentication]
      summary: Verify a password-reset code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCode'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a password using a verified code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
      responses:
        '200':
          description: Reset result; clears access and refresh cookies
          headers:
            Set-Cookie:
              description: Clears `access_token` and `refresh_token` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/profile/password-code:
    post:
      tags: [Authentication]
      summary: Request a password-change verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword:
                  type: string
      responses:
        '200':
          description: Request result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/profile/password:
    patch:
      tags: [Authentication]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeProfilePassword'
      responses:
        '200':
          description: Password-change result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/signin:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      description: Sets access and refresh cookies; tokens are not in the response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpLocal'
      responses:
        '200':
          description: Authenticated account; sets access and refresh cookies
          headers:
            Set-Cookie:
              description: Sets `access_token` and `refresh_token` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the session tokens
      description: Authenticates using the `refresh_token` cookie and sets new cookies.
      security:
        - RefreshTokenCookie: []
      responses:
        '201':
          description: Tokens refreshed; rotates access and refresh cookies
          headers:
            Set-Cookie:
              description: Sets new `access_token` and `refresh_token` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/google:
    get:
      tags: [Authentication]
      summary: Start Google OAuth sign-in
      description: Redirects to the Google OAuth provider. Requires no active session.
      security: []
      responses:
        '302':
          description: Redirect to Google OAuth
  /auth/google/callback:
    get:
      tags: [Authentication]
      summary: Handle Google OAuth callback
      description: Sets session cookies and redirects to the frontend dashboard.
      security: []
      responses:
        '302':
          description: Redirect to the frontend dashboard
          headers:
            Set-Cookie:
              description: Sets `access_token` and `refresh_token` cookies.
              schema:
                type: string
  /auth/promote/{id}:
    patch:
      tags: [Authentication]
      summary: Promote a user (admin only)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Promotion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/signout:
    post:
      tags: [Authentication]
      summary: Sign out and clear session cookies
      responses:
        '201':
          description: Signout result; clears access and refresh cookies
          headers:
            Set-Cookie:
              description: Clears `access_token` and `refresh_token` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user/update:
    patch:
      tags: [Users]
      summary: Update the current user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /farmer-group:
    get:
      tags: [Farmer groups]
      summary: List farmer groups
      parameters:
        - $ref: '#/components/parameters/Page8'
        - $ref: '#/components/parameters/Limit8'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated farmer groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
    post:
      tags: [Farmer groups]
      summary: Create a farmer group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFarmerGroup'
      responses:
        '200':
          description: Created group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /farmer-group/pending:
    get:
      tags: [Farmer groups]
      summary: List pending group applicants
      responses:
        '200':
          description: Pending applicants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /farmer-group/add-members:
    post:
      tags: [Farmer groups]
      summary: Add a member to the current group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: number
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
  /farmer-group/leave:
    post:
      tags: [Farmer groups]
      summary: Leave the current farmer group
      responses:
        '200':
          description: Leave result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /farmer-group/{id}:
    get:
      tags: [Farmer groups]
      summary: Get a farmer group
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Farmer group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /farmer-group/{id}/apply:
    post:
      tags: [Farmer groups]
      summary: Apply to join a farmer group
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Application result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /farmer-group/approve/{userId}:
    post:
      tags: [Farmer groups]
      summary: Approve a group applicant
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Approval result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmer-group/reject/{userId}:
    post:
      tags: [Farmer groups]
      summary: Reject a group applicant
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Rejection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmer-group/members/{userId}:
    delete:
      tags: [Farmer groups]
      summary: Remove a member from the current group
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Removal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /farmer-group/admin/groups:
    get:
      tags: [Farmer groups]
      summary: List groups for administration (declared route is shadowed)
      description: |
        This route is declared after `GET /farmer-group/{id}`. The earlier
        parameter route can consume `admin` and fail integer parsing, so this
        operation may be unreachable at runtime until the route order is fixed.
      parameters:
        - $ref: '#/components/parameters/Page8'
        - $ref: '#/components/parameters/Limit8'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmer-group/admin/groups/{id}:
    delete:
      tags: [Farmer groups]
      summary: Delete a group as an administrator
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Required by business logic despite being optional in the inline type.
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmer-group/admin/members/{userId}:
    delete:
      tags: [Farmer groups]
      summary: Remove a member as an administrator
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Removal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /farmlands:
    post:
      tags: [Farmlands]
      summary: Create a farmland
      description: The current controller/guard role metadata effectively denies the listed single roles with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFarmland'
      responses:
        '201':
          description: Created farmland
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmlands/my:
    get:
      tags: [Farmlands]
      summary: List the current user's farmlands
      description: The current role metadata effectively denies the listed single roles with 403.
      parameters:
        - $ref: '#/components/parameters/Page8'
        - $ref: '#/components/parameters/Limit8'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated farmlands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmlands/group/{id}:
    get:
      tags: [Farmlands]
      summary: List a group's farmlands
      description: The current role metadata effectively denies the listed single roles with 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page8'
        - $ref: '#/components/parameters/Limit8'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated farmlands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmlands/{id}:
    get:
      tags: [Farmlands]
      summary: Get a farmland
      description: The current role metadata effectively denies the listed single roles with 403.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Farmland
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Farmlands]
      summary: Update a farmland
      description: The current role metadata effectively denies the listed single roles with 403.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFarmland'
      responses:
        '200':
          description: Updated farmland
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Farmlands]
      summary: Delete a farmland
      description: The current role metadata effectively denies the listed single roles with 403.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmlands/{id}/replant:
    post:
      tags: [Farmlands]
      summary: Record replanting for a farmland
      description: The current role metadata effectively denies the listed single roles with 403.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFarmland'
      responses:
        '200':
          description: Replant result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /farmlands/{id}/weather:
    get:
      tags: [Farmlands]
      summary: Get farmland weather forecasts
      description: Returns forecasts for the farmland location; inactive farmland can produce 400.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Weather forecast data
          content:
            application/json:
              schema:
                type: object
                properties:
                  farmland_id:
                    type: integer
                  farmland_name:
                    type: string
                  adm4_code:
                    type: string
                  forecasts:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /commodities:
    get:
      tags: [Commodities]
      summary: List commodities
      parameters:
        - $ref: '#/components/parameters/Page8'
        - $ref: '#/components/parameters/Limit8'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated commodities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Commodities]
      summary: Create a commodity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommodity'
      responses:
        '201':
          description: Created commodity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /commodities/{id}:
    get:
      tags: [Commodities]
      summary: Get a commodity
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Commodity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Commodities]
      summary: Update a commodity (admin only)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommodity'
      responses:
        '200':
          description: Updated commodity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Commodities]
      summary: Delete a commodity (admin only)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /wilayah/provinces:
    get:
      tags: [Wilayah]
      summary: List provinces
      security: []
      responses:
        '200':
          description: Province data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /wilayah/regencies/{provinceCode}:
    get:
      tags: [Wilayah]
      summary: List regencies in a province
      security: []
      parameters:
        - name: provinceCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Regency data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /wilayah/districts/{regencyCode}:
    get:
      tags: [Wilayah]
      summary: List districts in a regency
      security: []
      parameters:
        - name: regencyCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: District data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /wilayah/villages/{districtCode}:
    get:
      tags: [Wilayah]
      summary: List villages in a district
      security: []
      parameters:
        - name: districtCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Village data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /media/images:
    post:
      tags: [Media]
      summary: Upload an image
      description: Maximum size 5 MB. Accepts JPG, PNG, and WebP. `moderation` purpose is admin-only.
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [product, profile, review, moderation]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPG, PNG, or WebP image; maximum 5 MB.
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                type: object
                required: [url, path]
                properties:
                  url:
                    type: string
                    format: uri
                  path:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /notification/device-token:
    post:
      tags: [Notifications]
      summary: Register a device notification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceToken'
      responses:
        '201':
          description: Registered token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
