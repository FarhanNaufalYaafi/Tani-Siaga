<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				const cachedUser = JSON.parse(localStorage.getItem('user') || 'null');
				const accountId = cachedUser?.id ?? cachedUser?.userId ?? cachedUser?.email ?? 'guest';
				document.documentElement.dataset.theme = localStorage.getItem(`tani-siaga-theme:${accountId}`) === 'dark' ? 'dark' : 'light';
			} catch {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="wadah-konten">%sveltekit.body%</div>
	</body>
</html>
